<header class="site-header">
  <div class="site-header__bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span>{{ site.title }}</span>
      <span class="brand__dot"></span>
    </a>

    <nav class="nav">
      <a class="nav__link{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="nav__link{% if page.url == '/experience/' %} is-active{% endif %}" href="{{ '/experience/' | relative_url }}">Experience</a>
      <a class="nav__link{% if page.url == '/projects/' %} is-active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>
      <a class="nav__link{% if page.url == '/resume/' %} is-active{% endif %}" href="{{ '/resume/' | relative_url }}">Resume</a>
    </nav>

    <div class="header__actions">
      <a class="icon-btn" href="{{ site.linkedin }}" target="_blank" rel="noreferrer" title="LinkedIn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#1E4B42" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95C20.4 8.75 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2 0-2.3 1.56-2.3 3.2V21H9z"></path></svg>
      </a>
      <a class="btn btn--primary btn--sm" href="mailto:{{ site.email }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
        Email me
      </a>
    </div>
  </div>
</header>
