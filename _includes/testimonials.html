<section class="testimonial-section">
  <div class="container">
    <h2 class="section-title" style="margin-bottom:34px">What people say</h2>
    <div class="testimonial-grid">
      {% for t in site.data.testimonials %}
      <figure class="testimonial">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#C8D5D0" aria-hidden="true"><path d="M7 6c-2.8 0-5 2.2-5 5s2.2 5 5 5c.3 0 .7 0 1-.1-.6 1.6-2 2.8-3.8 3.1v1.9c4.4-.4 7.8-4.1 7.8-8.6V11c0-2.8-2.2-5-5-5zm10 0c-2.8 0-5 2.2-5 5s2.2 5 5 5c.3 0 .7 0 1-.1-.6 1.6-2 2.8-3.8 3.1v1.9c4.4-.4 7.8-4.1 7.8-8.6V11c0-2.8-2.2-5-5-5z"></path></svg>
        <blockquote class="testimonial__quote">{{ t.quote }}</blockquote>
        <figcaption class="testimonial__author">{{ t.name }}<span class="testimonial__role">{{ t.role }}</span></figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
