  context: "Semester project"
  category: "Content strategy"
  title: "Content Strategy & Website Audit"
  org: "UNT Technical Communication Department"
  banner: assets/audit-view.png
  banner_alt: "UNT project — wireframe, audit spreadsheet, or analytics view"
  home_image: assets/audit-view.png
  home_teaser: "A semester diagnosing why the UNT Technical Communication site wasn't reaching its audience — and four prioritized fixes grounded in research, not opinion."
  problem: "The department's website wasn't clearly serving the people it was built for. I spent the semester diagnosing why — and proposing fixes grounded in research rather than opinion."
  process:
    - "Interviewed stakeholders to understand institutional goals and constraints"
    - "Ran a full content audit across every existing page"
    - "Compared Google Analytics behaviour against the site's assumptions about visitors"
    - "Synthesized findings into four prioritized revision recommendations"
    - "Built sample wireframes for two of them to make the changes concrete"
  outcome: "Four ranked recommendations, two of them already drawn up as wireframes — a plan a department could act on incrementally. This was an academic capstone built to develop practical content strategy skills rather than a client engagement, so the recommendations weren't implemented on the live site; our final deliverable earned an A."
