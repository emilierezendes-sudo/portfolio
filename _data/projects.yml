- slug: tirzah
  number: "02"
  context: "Internship portfolio"
  category: "Content & fundraising"
  title: "Content & Fundraising Strategy"
  org: "Tirzah International"
  banner: assets/tirzah-collage-wide.png
  banner_alt: "Tirzah project — event invitation, host manual, or published blog post"
  home_image: assets/tirzah-collage.png
  home_teaser: "Interviews turned into grant testimonials, donor emails, and impact stories for a nonprofit — plus a peer-to-peer fundraiser designed start to finish."
  problem: "Tirzah International, a nonprofit empowering women globally, needed donor- and grant-facing content plus a fully planned peer-to-peer fundraiser — the kind of work a small team rarely has bandwidth for in-house."
  process:
    - "Interviewed Emerging Leader Program graduates to surface authentic testimonies"
    - "Adapted each interview into grant testimonials, donor emails, and global impact stories"
    - "Wrote and published a full-length blog post"
    - "Designed a peer-to-peer fundraising event from scratch: invitations, schedule, host manual"
    - "Presented the finished project to three senior Tirzah staff for evaluation"
  outcome: "A ready-to-use content and fundraising kit: published writing, reusable donor and grant language drawn from real voices, and an event a volunteer host could run without me in the room. The three senior staff members I presented to responded positively, and were especially interested in adapting the concept into a virtual conference for future use. The materials weren't used for an event that year, but the underlying idea carried forward as a direction Tirzah wanted to explore."
  outcome_link: null
